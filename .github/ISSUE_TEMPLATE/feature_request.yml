name: Feature request
description: Suggest an improvement or a missing HLE function
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is it needed?
      description: Which homebrew or test needs it?
